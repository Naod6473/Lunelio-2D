# Service des sauvegardes (deploy/lunelio_api.py) : au plus 10 requêtes par seconde par adresse (pointes de 20)
limit_req_zone $binary_remote_addr zone=lunelio_api:1m rate=10r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /var/www/lunelio;
    index index.html;
    gzip on;
    gzip_types text/html application/json;

    # le dossier .git ne doit jamais être servi
    location ~ /\. { deny all; }
    # les sources ne sont pas utiles au navigateur
    location /src/ { deny all; }
    location /deploy/ { deny all; }

    # profils, sauvegardes et scores : transmis au service local (installer-service.sh), jamais en cache
    location /api/ {
        limit_req zone=lunelio_api burst=20 nodelay;
        client_max_body_size 320k;
        proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
