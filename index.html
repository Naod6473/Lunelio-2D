<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0820">
<title>Lunelio</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #0d0820; --frame: #2a1a4a; --text: #e8dcff;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d0820; --frame: #2a1a4a; --text: #e8dcff; } }
  :root[data-theme="dark"] { --bg: #0d0820; --frame: #2a1a4a; --text: #e8dcff; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    font-family: "Pixelify Sans", "Courier New", monospace; }
  canvas { display: block; width: min(100vw, calc((100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 480 / 272));
    max-width: 100%; aspect-ratio: 480 / 272; image-rendering: pixelated; outline: none;
    box-shadow: 0 0 0 2px var(--frame), 0 0 60px rgba(222,110,255,.18); }
  canvas:focus-visible { box-shadow: 0 0 0 2px #5ef0ff, 0 0 60px rgba(94,240,255,.25); }
  html, body { overscroll-behavior: none; }
  body { height: 100dvh; }
  body.touch, body.touch * { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body.touch canvas { width: min(100vw, calc(100dvh * 480 / 272)); box-shadow: none; }
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5; }
  body.touch #touch { display: block; }
  body.touch.pad #touch { display: none; }   /* manette branchée sur une tablette : pas de boutons à l'écran */
  #touch .ctl { pointer-events: auto; position: absolute; border-radius: 50%; display: none; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font: 700 24px "Pixelify Sans", "Courier New", monospace; line-height: 1; text-align: center;
    background: rgba(40,24,70,.55); border: 2px solid rgba(255,255,255,.45); box-shadow: 0 0 14px rgba(0,0,0,.35); }
  #touch .ctl small { display: block; font-size: 10px; opacity: .85; margin-top: 3px; letter-spacing: .5px; }
  #pad { background: radial-gradient(circle, rgba(40,24,70,.35) 0%, rgba(40,24,70,.55) 70%); }
  #bPause, #bFull { font-size: 16px; }
  #touch .ctl.on { background: rgba(255,255,255,.38); border-color: #fff; }
  body.playing #touch .game { display: flex; }
  #touch .always { display: flex; }
  #pad { left: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 138px; height: 138px; }
  #pad i { position: absolute; font-style: normal; font-size: 20px; opacity: .8; }
  #pad .l { left: 14px; top: 56px; } #pad .r { right: 14px; top: 56px; } #pad .d { left: 60px; bottom: 10px; }
  #pad.left .l, #pad.right .r, #pad.down .d { opacity: 1; color: #ffe08a; text-shadow: 0 0 8px #ffe08a; }
  #bJump { right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 80px; height: 80px; }
  #bAtk { right: calc(110px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 74px; height: 74px; }
  #bSpec { right: calc(30px + env(safe-area-inset-right, 0px)); bottom: calc(114px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; }
  #bPow { right: calc(112px + env(safe-area-inset-right, 0px)); bottom: calc(102px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; }
  #bPause { right: calc(10px + env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); width: 40px; height: 40px; border-radius: 12px; }
  #bFull { left: calc(10px + env(safe-area-inset-left, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); width: 40px; height: 40px; border-radius: 12px; font-size: 18px; }
  body.playing #bFull { display: none; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0d0820; color: #e8dcff; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; text-align: center; padding: 24px; font: 700 20px "Pixelify Sans", "Courier New", monospace; }
  #rotate b { font-size: 54px; display: block; animation: tourne 2s ease-in-out infinite; }
  @keyframes tourne { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) { body.touch #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Lunelio, jeu d'action. Flèches ou ZQSD pour bouger, Espace pour sauter, J pour trancher."></canvas>
<div id="touch" aria-hidden="true">
  <div id="pad" class="ctl game"><i class="l">◀</i><i class="r">▶</i><i class="d">▼</i></div>
  <div id="bJump" class="ctl game">▲<small>saut</small></div>
  <div id="bAtk" class="ctl game">⚔<small>coup</small></div>
  <div id="bSpec" class="ctl game">➤<small>dash</small></div>
  <div id="bPow" class="ctl game"><span id="powIcon">»</span><small id="powLbl">vitesse</small></div>
  <div id="bPause" class="ctl game">❚❚</div>
  <div id="bFull" class="ctl always">⛶</div>
</div>
<div id="rotate"><b>📱</b>Tourne ton appareil<br>pour jouer à Lunelio</div>

}

function updatePlay(rdt) {
  const d = df();
  if (hit("Escape", "KeyP", "TPause", "GStart")) { pauseGame(); return; }
  if (hit("KeyR", "GSelect") && !(lvl.json && campLocked(players[0]))) { if (lvl.json) loadCampRoom(camp.wi, camp.ri, { restart: true }); else loadLevel(lvlIdx); return; }
  // pouvoirs : chaque joueur a sa jauge ; le ralenti d'un joueur ralentit tout le jeu.
  // Pouvoir maintenu : la jauge se vide pendant l'effet. Coup unique (burst) : il coûte une part de la jauge.
  for (const p of players) {
    const pw = powerOf(p.C), locked = lvl.json && campLocked(p);
    if (pw && pw.burst) {
      p.powerOn = false;
      if (d.power && hit(...p.input.power) && !p.dead && !locked) burstPower(p, pw);
      p.gauge = Math.min(1, p.gauge + d.regen * rdt);
    } else {
      p.powerOn = !!(d.power && pw && down(...p.input.power) && p.gauge > 0 && !p.dead && !locked);
      p.gauge = p.powerOn ? Math.max(0, p.gauge - d.drain * rdt) : Math.min(1, p.gauge + d.regen * rdt);
    }
  }
  setTimeFx(players.some(p => usingPower(p, "slow")), players.some(p => usingPower(p, "fast")));
  runTime += rdt; roomTime += rdt; hintT += rdt;
  if (hitstop > 0) { hitstop -= rdt; return; }
  const dt = rdt * (slowOn ? 0.35 : 1);
  for (const p of players) if (!(lvl.json && campLocked(p))) updatePlayer(p, dt);
  if (lvl.json) updateCamp(dt); else updateEnemies(dt);
  updateLasers(dt); updateParts(dt);

    if (deathT <= 0) {

        else loadCampRoom(camp.wi, camp.ri, { restart: true });
      }
      else if (doomReset) { loadLevel(firstRoom(ROOMS[lvlIdx].w)); msg = { text: "Mode Doom : retour au début du monde !", t: 2.5 }; }

}

  const cx = p.x + 5, cy = p.y + 16;

    for (const e of enemies) {

      e.stunT = e.type === "boss" || e.type === "bigboss" ? 1.2 : 2.5;

    const free = [bx + 1, bx + 15].every(x => [by + 1, by + 15].every(y => !solidAt(x, y)));
    if (!free || by > VH - 8) { audio.sfx("nope"); return; }
    lvl.blocks.push({ x: bx, y: by, w: 16, h: 16, t: 5 });
    if (lvl.blocks.length > 3) lvl.blocks.shift();

    p.onGround = true; burst(cx, by + 8, 10, ["#4fbf3a", "#8a5a2a", "#ffffff"], 90, 0.4, 300, 2); audio.sfx("block");
  } else if (pw.effect === "heal") {
    if (p.hp >= df().hp) { msg = { text: "Tous tes cœurs sont déjà là !", t: 1.4 }; audio.sfx("nope"); return; }
    p.hp++; audio.sfx("heal"); msg = { text: "Pique-nique : +1 cœur", t: 1.4 };
    burst(cx, cy, 18, ["#ff4f8a", "#ffffff", "#ffb0d0"], 120, 0.6, 0, 1);

}
let pauseSel = 0;
const PUI = { resume: { x: 170, y: 104, w: 140, h: 24 }, options: { x: 170, y: 134, w: 140, h: 24 }, quit: { x: 170, y: 164, w: 140, h: 24 } };

  for (let i = 0; i < n; i++) if (inside(rowRect(i, step))) return i;
  return cur;
}
function openOptions(from) { optFrom = from; optSel = 0; lastMouse = mouse.x + "," + mouse.y; state = "options"; audio.sfx("select"); }
function closeOptions() { saveOptions(); state = optFrom === "pause" ? "pause" : "menu"; audio.sfx("select"); }
function optActivate(i) {
  const r = OPT_ROWS[i]; optSel = i;
  if (r.k === "back") { closeOptions(); return; }
  if (r.k === "kb" || r.k === "pad") { openKeys(r.k); return; }
  OPT[r.k] = !OPT[r.k]; saveOptions(); audio.sfx("select");
  if (r.k === "voice") { if (OPT.voice) voice.say("La voix est activée.", true); else voice.stop(); }
  if (r.k === "rumble" && OPT.rumble) rumble(250, 0.6, 0.6);
}
function updateOptions() {
  const n = OPT_ROWS.length;
  if (hit("Escape", "GB", "Backspace")) { closeOptions(); return; }
  optSel = hoverRow(n, 21, optSel);
  if (hit(...K.up)) { optSel = (optSel + n - 1) % n; audio.sfx("select"); }
  if (hit(...K.down)) { optSel = (optSel + 1) % n; audio.sfx("select"); }
  if (hit(...K.ok) || (hit("ArrowLeft", "ArrowRight", "GLeft", "GRight") && OPT_ROWS[optSel].k in OPT_DEFAULT)) { optActivate(optSel); return; }
  if (hit("Mouse0")) for (let i = 0; i < n; i++) if (inside(rowRect(i, 21))) { optActivate(i); return; }
}
function drawOptBg() {
  if (optFrom === "pause" && lvl) { if (lvl.json) drawCampWorld(); else drawWorld(); R(0, 0, VW, VH, "rgba(10,6,24,0.82)"); }
  else { if (!menuBgs) menuBgs = CHARS.map(C => makeBackground(C.ui, C)); ctx.drawImage(menuBgs[charIdx], 0, 0); R(0, 0, VW, VH, "rgba(13,8,32,0.72)"); }
}
function drawRow(b, sel, label, value, valueCol) {
  const C = ch();
  R(b.x, b.y, b.w, b.h, sel ? "rgba(255,255,255,0.16)" : "rgba(20,12,40,0.85)");
  ctx.strokeStyle = sel ? C.ui : "#3a2a5c"; ctx.lineWidth = 1; ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
  if (sel) { R(b.x + 3, b.y + 5, 2, b.h - 10, C.ui); }
  text(label, b.x + 10, b.y + b.h / 2 + 1, 9, sel ? "#ffffff" : "#e8dcff");
  if (value) text(value, b.x + b.w - 8, b.y + b.h / 2 + 1, 9, valueCol, "right");
}
function drawOptions() {
  const C = ch(); drawOptBg();
  text("Options", VW / 2, 22, 18, C.ui, "center", C.ui);
  OPT_ROWS.forEach((r, i) => {
    let v = "", col = "#b9a6e0";
    if (r.k in OPT_DEFAULT) { v = OPT[r.k] ? "Oui" : "Non"; col = OPT[r.k] ? "#7dffb0" : "#ff8ab0"; }
    else if (r.k !== "back") v = "›";
    drawRow(rowRect(i, 21), i === optSel, r.label, v, col);
  });
  const r = OPT_ROWS[optSel];
  let info = r.info;
  if (r.k === "voice" && !voice.ok()) info = "Ce navigateur ne sait pas lire à voix haute.";
  if (r.k === "buddy" && df().id === "doom") info = "Le mode copain ne marche pas en mode Doom.";
  text(info, VW / 2, 226, 8, "#e8dcff", "center");
  text(say("↑ ↓ pour choisir    Entrée pour changer    Échap pour revenir", "Touche une ligne pour la changer",
    "Croix pour choisir    {A} pour changer    {B} pour revenir"), VW / 2, 254, 8, "#b9a6e0", "center");
}

/* ---- Choix des touches et des boutons ---- */
let keysKind = "kb", keysSel = 0, padWait = false, keysMsg = null;
const keysRows = () => [...(keysKind === "kb" ? KB_ACTIONS : PAD_ACTIONS).map(([k, label]) => ({ k, label })),
  { k: "reset", label: "Remettre les touches de base" }, { k: "back", label: "Retour" }];
function openKeys(kind) { keysKind = kind; keysSel = 0; keyWait = padWait = false; keyCaught = null; keysMsg = null; state = "keys"; audio.sfx("select"); }
function bindNames(a) { return keysKind === "kb" ? OPT.kb[a].map(keyName).join(" / ") : OPT.pad[a].map(padBtnName).join(" / "); }
// Donne la touche v à l'action a ; si une autre action l'avait, elle la perd (et récupère les anciennes touches de a si elle n'a plus rien)
function assign(kind, a, v) {
  const B = kind === "kb" ? OPT.kb : OPT.pad, D = kind === "kb" ? KB_DEFAULT : PAD_DEFAULT, old = B[a];
  for (const o in B) if (o !== a && B[o].includes(v)) {
    B[o] = B[o].filter(x => x !== v);
    if (!B[o].length) B[o] = old.filter(x => x !== v);
    if (!B[o].length) B[o] = D[o].filter(x => x !== v);
  }
  B[a] = [v]; rebuildK(); saveOptions();
}
function keysActivate(i) {
  const rows = keysRows(), r = rows[i]; keysSel = i; keysMsg = null;
  if (r.k === "back") { state = "options"; audio.sfx("select"); return; }
  if (r.k === "reset") {
    const D = keysKind === "kb" ? KB_DEFAULT : PAD_DEFAULT, B = keysKind === "kb" ? OPT.kb : OPT.pad;
    for (const a in D) B[a] = D[a].slice();
    rebuildK(); saveOptions(); keysMsg = "Les touches de base sont revenues"; audio.sfx("door"); return;
  }
  audio.sfx("select");
  if (keysKind === "kb") { keyWait = true; keyCaught = null; } else padWait = true;
}
function updateKeys() {
  const rows = keysRows(), n = rows.length;
  if (keyWait) {
    if (hit("Mouse0", "Mouse2")) { keyWait = false; keyCaught = null; return; }
    if (!keyCaught) return;
    const { code, key } = keyCaught; keyCaught = null; keyWait = false;
    if (code === "Escape") { audio.sfx("select"); return; }
    if (KB_RESERVED.includes(code)) { keysMsg = "Cette touche sert déjà au jeu, choisis-en une autre"; keyWait = true; audio.sfx("hurt"); return; }
    if (key && key.length === 1 && key !== " ") OPT.labels[code] = key.toUpperCase(); else delete OPT.labels[code];
    assign("kb", rows[keysSel].k, code); audio.sfx("door"); return;
  }
  if (padWait) {
    if (hit("Escape", "Mouse0", "Mouse2") || (padRaw[9] && !padRawPrev[9])) { padWait = false; audio.sfx("select"); return; }
    const b = padRaw.findIndex((on, i) => on && !padRawPrev[i] && PAD_BINDABLE.includes(i));
    if (b >= 0) { assign("pad", rows[keysSel].k, b); padWait = false; audio.sfx("door"); }
    return;
  }
  if (hit("Escape", "GB", "Backspace")) { state = "options"; audio.sfx("select"); return; }
  keysSel = hoverRow(n, 20, keysSel);
  if (hit(...K.up)) { keysSel = (keysSel + n - 1) % n; audio.sfx("select"); }
  if (hit(...K.down)) { keysSel = (keysSel + 1) % n; audio.sfx("select"); }
  if (hit(...K.ok)) { keysActivate(keysSel); return; }
  if (hit("Mouse0")) for (let i = 0; i < n; i++) if (inside(rowRect(i, 20))) { keysActivate(i); return; }
}
function drawKeys() {
  const C = ch(), rows = keysRows(), waiting = keyWait || padWait;
  drawOptBg();
  text(keysKind === "kb" ? "Touches du clavier" : "Boutons de la manette", VW / 2, 22, 16, C.ui, "center", C.ui);
  rows.forEach((r, i) => {
    const sel = i === keysSel;
    let v = "", col = "#7dffb0";
    if (r.k !== "reset" && r.k !== "back") {
      if (sel && waiting) { v = keysKind === "kb" ? "Appuie sur une touche…" : "Appuie sur un bouton…"; col = Math.floor(time * 3) % 2 ? "#fccc28" : "#ffffff"; }
      else v = bindNames(r.k);
    }
    drawRow(rowRect(i, 20), sel, r.label, v, col);
  });
  const y = 44 + rows.length * 20 + 10;
  let info = keysMsg;
  if (!info) info = keysKind === "kb" ? "La souris marche toujours : clic pour trancher, clic droit pour le dash."
    : (padIdx === null ? "Aucune manette : branche-la et appuie sur un de ses boutons." : "La croix et le stick servent toujours à se déplacer.");
  text(info, VW / 2, y, 8, keysMsg ? "#fccc28" : "#e8dcff", "center");
  const help = waiting
    ? (keysKind === "kb" ? "Appuie sur la nouvelle touche    Échap pour annuler" : say("Appuie sur le nouveau bouton de la manette    Échap pour annuler", "Appuie sur le nouveau bouton de la manette", "Appuie sur le nouveau bouton    {START} pour annuler"))
    : say("↑ ↓ pour choisir    Entrée pour changer    Échap pour revenir", "Touche une ligne pour la changer", "Croix pour choisir    {A} pour changer    {B} pour revenir");
  text(help, VW / 2, 256, 8, "#b9a6e0", "center");
}

/* ---------------- Écrans de fin ---------------- */
function updateClear(rdt) {
  clearT -= rdt; updateParts(rdt);
  if (clearT <= 0 || hit("Enter", "Space", "Mouse0", "GA", "GStart")) {
    const r = ROOMS[lvlIdx], next = ROOMS[lvlIdx + 1];
    if (!(next && next.w === r.w)) voice.say(r.w + 1 < WORLDS.length ? `Monde terminé ! ${WORLDS[r.w].name} est sauvé. Bravo !` : `Victoire ! ${ch().name} a vaincu Dr. Boulon. Bravo !`, true);
    if (next && next.w === r.w) loadLevel(lvlIdx + 1);
    else {
      setProgress(r.w + 1);
      const prev = getBest(r.w);
      best = { time: runTime, deaths, isNew: !prev || runTime < prev.time };
      if (best.isNew) try { localStorage.setItem(bestKey(r.w), JSON.stringify({ time: runTime, deaths })); } catch (e) {}
      state = r.w + 1 < WORLDS.length ? "worldclear" : "win"; wcSel = 0;
    }
  }
}
function drawClear() {
  drawWorld();
  R(0, VH / 2 - 26, VW, 52, "rgba(10,6,24,0.8)");
  text("Salle terminée !", VW / 2, VH / 2 - 8, 18, "#7dffb0", "center", "#7dffb0");
  text(`Temps dans la salle : ${fmtTime(roomTime)}`, VW / 2, VH / 2 + 12, 9, "#e8dcff", "center");
}
function drawResult(title, sub) {
  const C = ch(), r = ROOMS[lvlIdx];
  ctx.drawImage(bgCanvas, 0, 0); R(0, 0, VW, VH, "rgba(13,8,32,0.65)");
  text(title, VW / 2, 42, 24, C.ui, "center", C.ui);
  text(sub, VW / 2, 66, 10, "#e8dcff", "center");
  drawChar(C, Math.floor(time * 5) % 4, VW / 2, 166, 1, 2);
  text(`Temps : ${fmtTime(runTime)}     Chutes : ${deaths}     Mode ${df().label}`, VW / 2, 176, 10, "#ffffff", "center");
  if (best) text(best.isNew ? "Nouveau record !" : "", VW / 2, 194, 10, "#fccc28", "center");
}
const WCUI = { next: { x: 150, y: 208, w: 180, h: 22 }, list: { x: 175, y: 236, w: 130, h: 18 } };
let wcSel = 0;
function updateWorldClear() {
  const r = ROOMS[lvlIdx];
  drawResult("Monde terminé !", `${BOSSES[WORLDS[r.w].id].name} est vaincu, ${WORLDS[r.w].name} est sauvé`);
  [["next", `Monde suivant : ${WORLDS[r.w + 1].name}`, "#7dffb0"], ["list", "Choisir un monde", "#b9a6e0"]].forEach(([k, label, col], i) => {
    const b = WCUI[k], hov = PAD ? wcSel === i : inside(b) && !TOUCH;
    R(b.x, b.y, b.w, b.h, hov ? "#ffffff" : "rgba(20,12,40,0.9)"); ctx.strokeStyle = col; ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
    text(label, b.x + b.w / 2, b.y + b.h / 2 + 1, k === "next" ? 9 : 8, hov ? "#120828" : col, "center");
  });
  if (hit("GUp", "GDown")) { wcSel = 1 - wcSel; audio.sfx("select"); }
  if (hit("GA")) { if (wcSel) openWorlds(); else startWorld(r.w + 1); }
  else if (hit("Enter", "Space", "GStart") || (hit("Mouse0") && inside(WCUI.next))) startWorld(r.w + 1);
  else if (hit("Escape", "GB") || (hit("Mouse0") && inside(WCUI.list))) openWorlds();
}
function drawWin() {
  drawResult("Victoire !", `${ch().name} a vaincu Dr. Boulon et sauvé les huit mondes !`);
  text(say("Entrée ou clic pour revenir au choix des mondes", "Touche l'écran pour revenir au choix des mondes", "{A} pour revenir au choix des mondes"), VW / 2, 230, 9, "#b9a6e0", "center");
  if (hit("Enter", "Space", "Mouse0", "Escape", "GA", "GB", "GStart")) openWorlds();
}

/* ---------------- Boucle ---------------- */
let last = performance.now();
function frame(now) {
  const rdt = Math.max(0, Math.min(1 / 30, (now - last) / 1000)); last = now; time += rdt;
  readPads();
  if (hit("KeyM", "Semicolon")) audio.toggleMute();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#0d0820"; ctx.fillRect(0, 0, cv.width, cv.height);
  let ox = 0, oy = 0;
  if (shake > 0) { ox = (Math.random() - 0.5) * shake; oy = (Math.random() - 0.5) * shake; shake = Math.max(0, shake - rdt * 30); }
  if (flash > 0) flash -= rdt;
  if (msg && msg.t > 0) msg.t -= rdt;
  ctx.setTransform(SC, 0, 0, SC, Math.round(ox * SC), Math.round(oy * SC));
  ctx.imageSmoothingEnabled = false;
  if (state === "loading") { text("Chargement…", VW / 2, VH / 2, 12, "#e8dcff", "center"); }
  else if (state === "menu") { updateMenu(); if (state === "menu") drawMenu(); }
  else if (state === "play") { updatePlay(rdt); if (state === "play") { if (lvl.json) { drawCampWorld(); drawOverlays(); drawCampHUD(); } else { drawWorld(); drawOverlays(); drawHUD(); } } }
  else if (state === "chars") { updateChars(rdt); if (state === "chars") drawChars(); }
  else if (state === "campwin") { drawCampWin(rdt); }
  else if (state === "clear") { updateClear(rdt); if (state === "clear") drawClear(); }
  else if (state === "worlds") { updateWorlds(); if (state === "worlds") drawWorlds(); }
  else if (state === "worldclear") { updateWorldClear(); }
  else if (state === "win") { drawWin(); }
  else if (state === "pause") { updatePause(); if (state === "pause") drawPause(); }
  else if (state === "options") { updateOptions(); if (state === "options") drawOptions(); }
  else if (state === "keys") { updateKeys(); if (state === "keys") drawKeys(); }
  const mk = OPT.music ? musicKey() : null;
  if (state !== "loading" && audio.ready && audio.wanted !== mk) audio.playMusic(mk);
  synthTick();
  syncTouchUI();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(scanCanvas, 0, 0);
  for (const k in pressed) delete pressed[k];
  requestAnimationFrame(frame);
}
Promise.all(Object.entries(SPRITES).map(([k, src]) => new Promise(res => { const i = new Image(); i.onload = () => { IMG[k] = i; res(); }; i.onerror = res; i.src = src; })))
  .then(() => preloadAtlases())
  .then(() => (document.fonts && document.fonts.load ? Promise.race([document.fonts.load(`700 12px "Pixelify Sans"`), new Promise(r => setTimeout(r, 1500))]) : null))
  .catch(() => {})
  .then(() => { goMenu(); cv.focus(); });
requestAnimationFrame(frame);
// Appli installable : le service worker garde le jeu et les sons pour jouer hors ligne (HTTPS ou localhost seulement)
if (AUDIO_MODE === "files" && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
